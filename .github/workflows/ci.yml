name: Unit tests, build & Pages
on:
  push:
    branches: [main, 'review/**']
  pull_request:
  workflow_dispatch:
    inputs:
      visual_review:
        description: Capture four cabin views for a visual review
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  versions:
    name: Publish Releases
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish Releases and offline download without overwriting tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/tag-versions.mjs
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      game_changed: ${{ steps.changes.outputs.game_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whether game files changed
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          let changed=true;
          const before=process.env.BEFORE_SHA;
          if(before&&!/^0+$/.test(before)){
            try{
              const files=execFileSync('git',['diff','--name-only',before,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
              changed=files.some(file=>!file.endsWith('.md')&&file!=='tools/tag-versions.mjs'&&file!=='.github/workflows/ci.yml');
            }catch{}
          }
          appendFileSync(process.env.GITHUB_OUTPUT,`game_changed=${changed}\n`);
          console.log(changed?'Game changes: build and deploy.':'Documentation or release automation only: retain the live site and gallery.');
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Build static site and offline HTML
        run: |
          npm run build
          npm run build:offline
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && steps.changes.outputs.game_changed == 'true'
        with:
          path: _site
  visual-review:
    name: Optional cabin snapshots
    if: (github.event_name == 'workflow_dispatch' && inputs.visual_review) || contains(github.event.head_commit.message, '[visual-check]')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install optional screenshot browser
        timeout-minutes: 6
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture four cabin views and verify offline runtime
        timeout-minutes: 3
        run: |
          npm run build
          npm run build:offline
          npm run screenshots
          node tools/review-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parking-lab-cabin-snapshots
          path: _site/screenshots/
          if-no-files-found: warn
          retention-days: 14
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.game_changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
