name: Test, screenshots & Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Physics and maneuver tests
        run: npm test
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests and screenshots
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parking-lab-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Stage static site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp index.html style.css game.js renderer.js physics.js _site/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
