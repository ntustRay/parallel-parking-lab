name: Build, screenshots & Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  versions:
    name: Publish Releases
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish Releases and offline download without overwriting tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/tag-versions.mjs
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      game_changed: ${{ steps.changes.outputs.game_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whether game files changed
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          let changed=true;
          const before=process.env.BEFORE_SHA;
          if(before&&!/^0+$/.test(before)){
            try{
              const files=execFileSync('git',['diff','--name-only',before,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
              changed=files.some(file=>!file.endsWith('.md')&&file!=='tools/tag-versions.mjs'&&file!=='.github/workflows/ci.yml');
            }catch{}
          }
          appendFileSync(process.env.GITHUB_OUTPUT,`game_changed=${changed}\n`);
          console.log(changed?'Game changes: capture and deploy.':'Documentation or release automation only: retain the live site and gallery.');
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static site
        run: node build.js
      - name: Install screenshot browser
        if: steps.changes.outputs.game_changed == 'true'
        id: capture_browser
        continue-on-error: true
        timeout-minutes: 5
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture UI steps (no tests)
        if: steps.capture_browser.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        run: npm run screenshots
      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.game_changed == 'true'
        with:
          name: parking-lab-step-screenshots
          path: _site/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && steps.changes.outputs.game_changed == 'true'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.game_changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
